name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

env:
  GODOT_VERSION: "4.4.1"

jobs:
  # Layer 1 — no Godot at all. Seconds, so it runs everywhere on every push.
  check:
    name: Lint, build & unit tests
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [18, 20]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node }}
          cache: npm
          cache-dependency-path: server/package-lock.json
      # package-lock.json is committed (9.1.3), so the tree is reproducible.
      - run: npm ci
        working-directory: server
      - run: npm run lint
        working-directory: server
      - run: npm run build
        working-directory: server
      - run: npm test
        working-directory: server

  # Layers 2 and 3 — need a Godot binary but no editor window and no MCP server.
  # Under ten seconds once the distribution is cached, so they also run per push.
  # macOS is here and not in the e2e job on purpose: this is the cheapest run that
  # still downloads, unpacks and executes a Godot binary, so it is what proves the
  # darwin platform module works at all. Without it that module is dead code.
  godot-fast:
    name: GDScript unit tests & parse gate (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - uses: actions/cache@v4
        with:
          path: .e2e_work/cache
          key: godot-dist-${{ env.GODOT_VERSION }}-${{ runner.os }}
      - run: node e2e/check-syntax.mjs --godot ${{ env.GODOT_VERSION }} --all
      - run: node e2e/unit.mjs --godot ${{ env.GODOT_VERSION }}

  # Layer 4 — boots a real editor headless and drives all 163 tools through the
  # full MCP stack. Rendering-dependent tests skip themselves under --headless.
  e2e:
    name: End-to-end (headless, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
          cache-dependency-path: server/package-lock.json
      - uses: actions/cache@v4
        with:
          path: .e2e_work/cache
          key: godot-dist-${{ env.GODOT_VERSION }}-${{ runner.os }}
      - run: npm ci
        working-directory: server
      # The suite runs the production build, not the sources.
      - run: npm run build
        working-directory: server
      - run: node e2e/run.mjs --godot ${{ env.GODOT_VERSION }} --headless
      # The suite drives one client and would pass against the old transport
      # direction too; this is what checks two sessions on one editor.
      - run: node e2e/multi-session.mjs --godot ${{ env.GODOT_VERSION }}
      # Restarting the editor is ordinary; recovering from it depends on the
      # client rediscovering rather than caching, which nothing else checks.
      - run: node e2e/reconnect.mjs --godot ${{ env.GODOT_VERSION }}
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: e2e-report-${{ matrix.os }}
          path: .e2e_work/reports/
